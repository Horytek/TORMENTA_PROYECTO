# Nginx del VPS — Horytek ERP + POS
#
# Va en /etc/nginx/sites-available/horytek y se enlaza a sites-enabled.
# Nginx corre NATIVO en el host, no en contenedor: certbot renueva con mucha
# menos fricción así.
#
# No hay bloque de WebSocket a propósito. Socket.IO se removió del proyecto —
# los eventos que definía eran señalización de llamadas WebRTC que ningún
# frontend consumía. Si algún día vuelve algo por WebSocket, hace falta agregar
# el upgrade de conexión en el location de /api.

# Redirección a HTTPS. Certbot agrega esto solo, pero queda explícito.
server {
    listen 80;
    listen [::]:80;
    server_name horycore.online www.horycore.online;

    # Certbot necesita servir el desafío por HTTP plano.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name horycore.online www.horycore.online;

    # Rutas que escribe certbot al emitir el certificado.
    ssl_certificate     /etc/letsencrypt/live/horycore.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horycore.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS. Ojo: una vez que un navegador lo ve, no vuelve a aceptar HTTP en
    # este dominio durante el max-age. No activar hasta confirmar que el
    # certificado renueva solo.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Los comprobantes en PDF y las imágenes de catálogo pesan; el límite por
    # defecto de 1 MB corta las subidas de fotos de producto.
    client_max_body_size 20M;

    # Comprimir lo que sirve la app. Las imágenes ya vienen comprimidas.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/horytek.access.log;
    error_log  /var/log/nginx/horytek.error.log;

    # ── API y frontend: todo va al proceso Node ──────────────────────────
    # El backend sirve también los estáticos de client-v2, así que no hace falta
    # que Nginx conozca el directorio dist. Una cosa menos que sincronizar en
    # cada despliegue.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El login tarda ~500 ms por bcrypt y la emisión ante SUNAT puede
        # demorar bastante más. 60s deja margen sin colgar conexiones muertas.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Imágenes subidas ─────────────────────────────────────────────────
    # Las sirve Nginx directo desde el volumen: no tiene sentido despertar a
    # Node para devolver un archivo estático.
    location /uploads/ {
        alias /opt/horytek/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Salud ────────────────────────────────────────────────────────────
    # Sin log: si no, el chequeo cada 30s llena el archivo.
    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }
}
