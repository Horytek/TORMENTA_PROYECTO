# Nginx del VPS — FASE 1, solo HTTP (sin TLS todavía)
#
# Existe para romper una dependencia circular: nginx.conf referencia el
# certificado en /etc/letsencrypt/live/, y `nginx -t` falla si ese archivo no
# existe — pero certbot necesita nginx sirviendo el desafío para emitirlo.
#
# Esta config sirve la app por HTTP plano y expone el webroot del desafío.
# Una vez emitido el certificado se reemplaza por deploy/nginx.conf.
# Ver deploy/README.md §6.

server {
    listen 80;
    listen [::]:80;
    server_name horycore.online www.horycore.online;

    # Certbot escribe el desafío acá y lo lee por HTTP plano.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20M;

    access_log /var/log/nginx/horytek.access.log;
    error_log  /var/log/nginx/horytek.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /uploads/ {
        alias /opt/horytek/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }
}
